name: Primeiro acesso dos donos

# Cria o link de primeiro acesso (ou de troca de senha) para um dos donos da
# plataforma, que não têm um administrador acima deles para gerar o link.
# Recebe só o SHA-256 do token: o link em si nunca passa pelo GitHub.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-mail do dono da plataforma"
        required: true
        type: choice
        options: [elitefrascarolisystems@gmail.com, teamfrascaroli@gmail.com]
      token_hash:
        description: "SHA-256 (64 caracteres hexadecimais) do token do link"
        required: true
        type: string

env:
  WORKER_NAME: elite-expansion-x-teste
  D1_DATABASE_NAME: elite-expansion-x-teste

jobs:
  link:
    name: Registrar link de acesso (teste)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMAIL: ${{ inputs.email }}
      TOKEN_HASH: ${{ inputs.token_hash }}
    steps:
      - name: Conferir entrada
        run: |
          [[ "$TOKEN_HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::token_hash precisa ter 64 caracteres hexadecimais."; exit 1; }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gravar link no banco de teste (vale 72 horas, uso único)
        run: |
          set -euo pipefail
          id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.argv[1]);process.stdout.write(db?db.uuid:"")})' "$D1_DATABASE_NAME")"
          [ -n "$id" ] || { echo "::error::Banco $D1_DATABASE_NAME não encontrado. Rode antes a publicação do ambiente de teste."; exit 1; }
          cat > wrangler.link.json <<JSON
          {"name":"$WORKER_NAME","compatibility_date":"2026-05-15",
           "d1_databases":[{"binding":"DB","database_name":"$D1_DATABASE_NAME","database_id":"$id"}]}
          JSON
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          expires="$(date -u -d '+72 hours' +%Y-%m-%dT%H:%M:%S.000Z)"
          npx wrangler d1 execute DB --remote -c wrangler.link.json --command \
            "DELETE FROM password_links WHERE email='$EMAIL' AND used_at IS NULL; INSERT INTO password_links(token_hash,email,created_by,created_at,expires_at) VALUES('$TOKEN_HASH','$EMAIL','github-actions','$now','$expires');"
          rm wrangler.link.json
          echo "::notice title=Link registrado::Link de acesso de $EMAIL válido até $expires (UTC)."
