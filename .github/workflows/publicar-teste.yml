name: Publicar ambiente de teste

# Publica o branch multiempresa num Worker e banco D1 SÓ de teste, separados
# da produção. Precisa, nas configurações do repositório (Settings → Secrets
# and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# O login é por e-mail e senha, dentro da própria plataforma (db/auth.ts).
on:
  push:
    branches: [multiempresa]
  workflow_dispatch:
    inputs:
      link_email:
        description: "Opcional: dono da plataforma que recebe um link de primeiro acesso / nova senha"
        required: false
        default: ""
        type: choice
        options: ["", elitefrascarolisystems@gmail.com, teamfrascaroli@gmail.com]
      link_token_hash:
        description: "SHA-256 (64 hexadecimais) do token do link. O link em si nunca passa pelo GitHub."
        required: false
        default: ""
        type: string
      membro_email:
        description: "Opcional: e-mail de alguém da equipe Elite para cadastrar e mandar link de acesso (usa link_token_hash)"
        required: false
        default: ""
        type: string
      membro_nome:
        description: "Nome dessa pessoa"
        required: false
        default: ""
        type: string
      membro_funcao:
        description: "Função dessa pessoa na Elite"
        required: false
        default: "Coordenação"
        type: choice
        options: [Coordenação, Administrador, Comercial]
      membro_cargo:
        description: "Opcional: cargo dessa pessoa (ex.: Executivo de Vendas)"
        required: false
        default: ""
        type: string
      membro_mentoria:
        description: "Ciclo de mentoria dessa pessoa (0 = não é mentorada)"
        required: false
        default: "0"
        type: string
      diagnostico_email:
        description: "Opcional: e-mail de alguém que não consegue entrar. Só consulta (perfil, senha, link, bloqueio); não muda nada."
        required: false
        default: ""
        type: string

concurrency:
  group: publicar-teste
  cancel-in-progress: false

env:
  WORKER_NAME: elite-expansion-x-teste
  D1_DATABASE_NAME: elite-expansion-x-teste

jobs:
  publicar:
    name: Banco, migrações e publicação (teste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir conta Cloudflare
        id: conta
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Publicação pulada::Conta Cloudflare ainda não ligada (faltam CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID)."
            echo "pronta=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronta=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.conta.outputs.pronta == 'true'

      - uses: actions/setup-node@v5
        if: steps.conta.outputs.pronta == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: steps.conta.outputs.pronta == 'true'
        run: npm ci --no-audit --no-fund

      - name: Banco de teste (cria se não existir)
        if: steps.conta.outputs.pronta == 'true'
        id: banco
        run: |
          set -euo pipefail
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.argv[1]);process.stdout.write(db?db.uuid:"")})' "$D1_DATABASE_NAME"; }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler d1 create "$D1_DATABASE_NAME"
            id="$(find_id)"
          fi
          [ -n "$id" ] || { echo "::error::Não foi possível criar ou encontrar o banco $D1_DATABASE_NAME."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice title=Banco de teste::$D1_DATABASE_NAME pronto."

      - name: Aplicar migrações no banco de teste
        if: steps.conta.outputs.pronta == 'true'
        env:
          D1_DATABASE_ID: ${{ steps.banco.outputs.id }}
        run: |
          set -euo pipefail
          cat > wrangler.migracoes.json <<JSON
          {"name":"$WORKER_NAME","compatibility_date":"2026-05-15",
           "d1_databases":[{"binding":"DB","database_name":"$D1_DATABASE_NAME","database_id":"$D1_DATABASE_ID","migrations_dir":"drizzle"}]}
          JSON
          npx wrangler d1 migrations apply DB --remote -c wrangler.migracoes.json
          rm wrangler.migracoes.json

      - name: Compilar para o ambiente de teste
        if: steps.conta.outputs.pronta == 'true'
        env:
          D1_DATABASE_ID: ${{ steps.banco.outputs.id }}
        run: npm run build

      - name: Publicar
        if: steps.conta.outputs.pronta == 'true'
        id: publicar
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee publicar.txt
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' publicar.txt | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Endereço do ambiente de teste::${url:-veja o painel da Cloudflare}"

      - name: Conferir se responde
        if: steps.conta.outputs.pronta == 'true' && steps.publicar.outputs.url != ''
        run: |
          sleep 5
          # (sem "read": a saída do curl não termina em quebra de linha e o read falharia com -e)
          out="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "${{ steps.publicar.outputs.url }}/")"
          code="${out%% *}"; location="${out#* }"
          echo "::notice title=Resposta do ambiente de teste::HTTP $code ${location:-} (307 para /entrar = tela de entrada da plataforma)"
          case "$code" in 200|302|303|307) ;; *) echo "::error::Resposta inesperada: HTTP $code"; exit 1;; esac
          # Cloudflare Access ligado no endereço workers.dev: só membros da conta Cloudflare passam,
          # e a equipe nem chega à tela de entrada da plataforma.
          case "${location:-}" in *cloudflareaccess.com*)
            echo "::warning title=Cloudflare Access ligado::O endereço de teste está protegido pelo Cloudflare Access: só membros da conta Cloudflare entram. Para a equipe usar, desligue em Workers & Pages → $WORKER_NAME → Settings → Domains & Routes → workers.dev (ou apague o aplicativo em Zero Trust → Access → Applications).";;
          esac

      # Os donos da plataforma não têm administrador acima deles para gerar o
      # link de acesso pela tela; este passo grava o link deles (72 horas, uso único).
      - name: Link de acesso de um dono da plataforma
        if: steps.conta.outputs.pronta == 'true' && inputs.link_email != ''
        env:
          D1_DATABASE_ID: ${{ steps.banco.outputs.id }}
          EMAIL: ${{ inputs.link_email }}
          TOKEN_HASH: ${{ inputs.link_token_hash }}
        run: |
          set -euo pipefail
          [[ "$TOKEN_HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::link_token_hash precisa ter 64 caracteres hexadecimais."; exit 1; }
          cat > wrangler.link.json <<JSON
          {"name":"$WORKER_NAME","compatibility_date":"2026-05-15",
           "d1_databases":[{"binding":"DB","database_name":"$D1_DATABASE_NAME","database_id":"$D1_DATABASE_ID"}]}
          JSON
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          expires="$(date -u -d '+72 hours' +%Y-%m-%dT%H:%M:%S.000Z)"
          npx wrangler d1 execute DB --remote -c wrangler.link.json --command \
            "DELETE FROM password_links WHERE email='$EMAIL' AND used_at IS NULL; INSERT INTO password_links(token_hash,email,created_by,created_at,expires_at) VALUES('$TOKEN_HASH','$EMAIL','github-actions','$now','$expires');"
          rm wrangler.link.json
          echo "::notice title=Link de acesso registrado::$EMAIL, válido até $expires (UTC)."

      # Cadastra alguém da equipe Elite (organização principal) e grava o link para
      # essa pessoa criar a senha. Usado enquanto nenhum dono entrou para fazer pela tela.
      - name: Cadastrar membro da equipe Elite com link de acesso
        if: steps.conta.outputs.pronta == 'true' && inputs.membro_email != ''
        env:
          D1_DATABASE_ID: ${{ steps.banco.outputs.id }}
          EMAIL_INFORMADO: ${{ inputs.membro_email }}
          NOME: ${{ inputs.membro_nome }}
          FUNCAO: ${{ inputs.membro_funcao }}
          TOKEN_HASH: ${{ inputs.link_token_hash }}
          OUTRO_LINK: ${{ inputs.link_email }}
          CARGO: ${{ inputs.membro_cargo }}
          MENTORIA: ${{ inputs.membro_mentoria }}
          ATOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [ -z "$OUTRO_LINK" ] || { echo "::error::Use link_email OU membro_email, não os dois (o token é um só)."; exit 1; }
          EMAIL="$(printf '%s' "$EMAIL_INFORMADO" | tr '[:upper:]' '[:lower:]')"
          [[ "$EMAIL" =~ ^[a-z0-9._+-]+@[a-z0-9-]+(\.[a-z0-9-]+)+$ ]] || { echo "::error::membro_email inválido."; exit 1; }
          [[ "$NOME" =~ ^[[:alpha:]][[:alpha:]\ .-]{1,79}$ ]] && [[ "$NOME" != *\'* ]] || { echo "::error::membro_nome inválido (só letras, espaço, ponto e hífen)."; exit 1; }
          # Sem link_token_hash: só cadastra ou atualiza o perfil, sem mexer no link que a pessoa já tem.
          [ -z "$TOKEN_HASH" ] || [[ "$TOKEN_HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::link_token_hash precisa ter 64 caracteres hexadecimais."; exit 1; }
          [ -z "$CARGO" ] || { [[ "$CARGO" =~ ^[[:alpha:]][[:alpha:]\ .,/-]{1,79}$ ]] && [[ "$CARGO" != *\'* ]]; } || { echo "::error::membro_cargo inválido (só letras, espaço e . , / -)."; exit 1; }
          [[ "$MENTORIA" =~ ^([0-9]|10)$ ]] || { echo "::error::membro_mentoria deve ser um número de 0 a 10."; exit 1; }
          cat > wrangler.link.json <<JSON
          {"name":"$WORKER_NAME","compatibility_date":"2026-05-15",
           "d1_databases":[{"binding":"DB","database_name":"$D1_DATABASE_NAME","database_id":"$D1_DATABASE_ID"}]}
          JSON
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          expires="$(date -u -d '+72 hours' +%Y-%m-%dT%H:%M:%S.000Z)"
          npx wrangler d1 execute DB --remote -c wrangler.link.json --command \
            "INSERT INTO app_users(organization_id,email,name,role,active,created_by,created_at) SELECT 1,'$EMAIL','$NOME','$FUNCAO',1,'github-actions','$now' WHERE NOT EXISTS(SELECT 1 FROM app_users WHERE organization_id=1 AND lower(email)='$EMAIL'); \
             UPDATE app_users SET active=1,role='$FUNCAO',name='$NOME'$([ -z "$CARGO" ] || printf ",title='%s'" "$CARGO"),mentorship_cycle=$MENTORIA WHERE organization_id=1 AND lower(email)='$EMAIL'; \
             DELETE FROM login_throttle WHERE key='email:$EMAIL'; \
             INSERT INTO audit_logs(organization_id,actor_email,action,entity_type,summary,created_at) VALUES(1,'github-actions','create_user','app_user','Perfil de $EMAIL definido como $FUNCAO pela publicação de teste (pedido de $ATOR).','$now');"
          if [ -n "$TOKEN_HASH" ]; then
            npx wrangler d1 execute DB --remote -c wrangler.link.json --command \
              "DELETE FROM password_links WHERE email='$EMAIL' AND used_at IS NULL; \
               INSERT INTO password_links(token_hash,email,created_by,created_at,expires_at) VALUES('$TOKEN_HASH','$EMAIL','github-actions','$now','$expires');"
            echo "::notice title=Membro cadastrado::$EMAIL ($FUNCAO). Link de acesso válido até $expires (UTC)."
          else
            echo "::notice title=Perfil atualizado::$EMAIL ($FUNCAO). Nenhum link novo foi gerado."
          fi
          rm wrangler.link.json

      - name: Diagnóstico de acesso (só leitura)
        if: steps.conta.outputs.pronta == 'true' && inputs.diagnostico_email != ''
        env:
          D1_DATABASE_ID: ${{ steps.banco.outputs.id }}
          EMAIL_INFORMADO: ${{ inputs.diagnostico_email }}
        run: |
          set -euo pipefail
          EMAIL="$(printf '%s' "$EMAIL_INFORMADO" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          [[ "$EMAIL" =~ ^[a-z0-9._+-]+@[a-z0-9-]+(\.[a-z0-9-]+)+$ ]] || { echo "::error::diagnostico_email inválido."; exit 1; }
          cat > wrangler.diag.json <<JSON
          {"name":"$WORKER_NAME","compatibility_date":"2026-05-15",
           "d1_databases":[{"binding":"DB","database_name":"$D1_DATABASE_NAME","database_id":"$D1_DATABASE_ID"}]}
          JSON
          # Nada de hash, senha ou token na saída: só se existe, datas e situação.
          npx wrangler d1 execute DB --remote -c wrangler.diag.json --json --command \
            "SELECT 'perfil' AS item, u.organization_id AS org, o.name AS empresa, u.role AS funcao, u.active AS ativo, o.active AS empresa_ativa FROM app_users u JOIN organizations o ON o.id=u.organization_id WHERE lower(u.email)='$EMAIL'; \
             SELECT 'senha' AS item, COUNT(*) AS tem_senha, MAX(updated_at) AS criada_ou_trocada, MAX(last_login_at) AS ultimo_login FROM user_credentials WHERE email='$EMAIL'; \
             SELECT 'link' AS item, created_at AS gerado, expires_at AS vence, used_at AS usado, CASE WHEN used_at IS NOT NULL THEN 'usado' WHEN expires_at<strftime('%Y-%m-%dT%H:%M:%fZ','now') THEN 'vencido' ELSE 'valendo' END AS situacao FROM password_links WHERE email='$EMAIL' ORDER BY created_at DESC LIMIT 3; \
             SELECT 'bloqueio' AS item, failures AS tentativas_erradas, window_started_at AS desde, locked_until AS bloqueado_ate FROM login_throttle WHERE key='email:$EMAIL'; \
             SELECT 'sessoes' AS item, COUNT(*) AS abertas, MAX(created_at) AS ultima FROM user_sessions WHERE email='$EMAIL' AND expires_at>strftime('%Y-%m-%dT%H:%M:%fZ','now');" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s))for(const row of r.results)console.log("::notice title=Diagnóstico::"+JSON.stringify(row));})'
          rm wrangler.diag.json
